<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Corvo — Página inicial</title>
<style>
:root{color-scheme:dark;--bg:#080e1c;--blue:#65c8fa;--light:#ecf7ff;--muted:#9aafc5;--panel:#101e30}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(ellipse 290px 210px at 50% 16%,#123f69 0%,transparent 80%),linear-gradient(145deg,#08101c 0%,#070d18 70%,#0a1727 100%);color:var(--light);padding:26px 22px 44px}
main{max-width:630px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:650;letter-spacing:2px;font-size:10px}
.top .dot{background:#53cfbc;display:inline-block;width:7px;height:7px;border-radius:100%;box-shadow:0 0 11px #53cfbc;margin-right:8px}
.hero{text-align:center;padding-top:50px}
.raven{width:118px;height:118px;display:block;margin:0 auto 16px;filter:drop-shadow(0 0 20px #197cad66)}
h1{font-size:42px;letter-spacing:8px;line-height:1;margin:7px 0 8px;font-weight:800;color:#f1f8ff}
.subtitle{font-size:11px;letter-spacing:4px;color:var(--blue);font-weight:750}
.tagline{font-size:14px;color:var(--muted);line-height:1.6;margin:27px 0 26px}
.search{margin:25px auto 0;background:#101d2e;border:1px solid #315377;border-radius:18px;display:flex;align-items:center;gap:10px;padding:7px 7px 7px 16px;box-shadow:0 16px 45px #0006;max-width:600px}
.search .magnify{width:18px;height:18px;opacity:.8;flex:none}
.search input{min-width:0;flex:1;border:0;outline:0;font-family:inherit;font-size:16px;background:transparent;color:#fff;padding:10px 0}
.search input::placeholder{color:#8195a9}
.search button{height:44px;min-width:70px;border:0;border-radius:12px;background:linear-gradient(130deg,#49bfff,#238cce);color:#05101c;font-weight:850;font-size:13px}
.provider{display:flex;justify-content:center;align-items:center;gap:7px;margin:18px 0 38px;color:#8fa9bd;font-size:12px}
.provider select{font-size:12px;background:#17283b;color:#d6eeff;border:1px solid #31516e;padding:6px 9px;border-radius:9px}
.label{font-weight:750;letter-spacing:1.8px;color:#8ea9be;font-size:11px;margin:0 0 14px}
.shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.shortcuts a{display:flex;align-items:center;text-decoration:none;color:#eaf6ff;border:1px solid #233e58;background:linear-gradient(145deg,#15283c,#0d1b2b);border-radius:16px;min-height:82px;padding:14px;gap:12px}
.shortcuts .symbol{display:grid;place-items:center;width:39px;height:39px;border-radius:13px;background:#1e4260;font-size:17px;font-weight:850;color:#91ddff;flex:none}
.shortcuts span:last-child{font-weight:650;font-size:14px}
.footer{text-align:center;color:#68839d;font-size:11px;letter-spacing:1.1px;line-height:1.8;margin-top:41px}
@media(max-width:370px){.shortcuts{gap:8px}.shortcuts a{padding:10px;gap:8px}.hero{padding-top:32px}.raven{width:95px;height:95px}}
</style>
</head>
<body>
<main>
  <div class="top"><span>CORVO / NAVEGADOR</span><span><i class="dot"></i>SEU ESPAÇO</span></div>
  <section class="hero">
    <svg class="raven" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Símbolo do Corvo">
      <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#7bd8ff"/><stop offset="1" stop-color="#0c72af"/></linearGradient></defs>
      <circle cx="65" cy="65" r="57" fill="#0a1c30" stroke="#217db4" stroke-width="2"/>
      <path d="M29 91C36 74 33 45 57 28c22-15 50 3 50 19l14 7-21 8-11 22-17 9-3 13-14-9-26 4z" fill="url(#g)"/>
      <path d="M26 93 62 71l-12 28z" fill="#105a8c"/><path d="M86 41c-7-7-16-10-28-8 12 5 18 13 21 21z" fill="#c9f2ff" opacity=".35"/>
      <path d="M69 49c6-3 12-2 17 0-5 4-11 5-17 0" fill="#041420"/><circle cx="77" cy="48" r="2" fill="#d5f8ff"/>
      <path d="M33 87c13-9 20-10 38-10" fill="none" stroke="#a7eaff" stroke-width="2" opacity=".5"/>
    </svg>
    <h1>CORVO</h1>
    <div class="subtitle">NAVEGADOR PARTICULAR</div>
    <p class="tagline">Sua internet. Suas escolhas.<br>Sem anúncios do aplicativo.</p>
  </section>
  <form class="search" id="searchform">
    <svg class="magnify" viewBox="0 0 24 24" fill="none" stroke="#7ecdf7" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M16 16 21 21"/></svg>
    <input id="term" type="search" placeholder="Pesquisar ou inserir endereço" autocomplete="off" spellcheck="false" aria-label="Pesquisar ou digitar endereço" required>
    <button type="submit">IR</button>
  </form>
  <div class="provider"><span>Pesquisar com</span><select id="provider" aria-label="Mecanismo de pesquisa"><option value="google">Google</option><option value="duckduckgo">DuckDuckGo</option><option value="bing">Bing</option></select></div>
  <p class="label">ACESSO RÁPIDO</p>
  <div class="shortcuts">
    <a href="https://www.youtube.com/"><span class="symbol">▶</span><span>YouTube</span></a>
    <a href="https://x.com/"><span class="symbol">X</span><span>Rede X</span></a>
    <a href="https://www.google.com/"><span class="symbol">G</span><span>Google</span></a>
    <a href="https://pt.wikipedia.org/"><span class="symbol">W</span><span>Wikipedia</span></a>
  </div>
  <p class="footer">CORVO • NAVEGAÇÃO INDEPENDENTE<br>O conteúdo dos sites pertence aos respectivos serviços.</p>
</main>
<script>
(function(){
const q=document.getElementById('term'),p=document.getElementById('provider');
try {const remembered=localStorage.getItem('corvo-search');if(['google','bing','duckduckgo'].includes(remembered))p.value=remembered;}catch(e){}
p.addEventListener('change',function(){try{localStorage.setItem('corvo-search',p.value);}catch(e){}});
document.getElementById('searchform').addEventListener('submit',function(e){
e.preventDefault();let s=q.value.trim();if(!s)return;
if(/^https?:\/\//i.test(s)){location.href=s;return;}
if(/^[^\s]+\.[^\s]+$/.test(s)){location.href='https://'+s;return;}
const base={google:'https://www.google.com/search?q=',duckduckgo:'https://duckduckgo.com/?q=',bing:'https://www.bing.com/search?q='};
location.href=base[p.value]+encodeURIComponent(s);
});
})();
</script>
</body></html>
