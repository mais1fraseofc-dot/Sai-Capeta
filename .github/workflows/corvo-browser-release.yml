name: Corvo Browser Release
on:
  push:
    branches: [corvo-navegador-updates]
  pull_request:
    branches: [main]
    paths: ['corvo-browser/**', '.github/workflows/corvo-browser-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: corvo-browser-signing-v1
      - name: Initialize signing identity if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Corvo Browser Beta,OU=Corvo,O=Personal App,C=BR'
          fi
      - name: Build signed Android application
        run: gradle -p corvo-browser assembleDebug --stacktrace
      - name: Publish latest version on dedicated branch
        if: github.event_name == 'push'
        run: |
          mkdir -p corvo-publish
          cp corvo-browser/app/build/outputs/apk/debug/app-debug.apk corvo-publish/Corvo-Navegador.apk
          CODE=$(grep -oP 'versionCode\s+\K[0-9]+' corvo-browser/app/build.gradle | head -1)
          NAME=$(grep -oP "versionName '\\K[^']+" corvo-browser/app/build.gradle | head -1)
          HASH=$(sha256sum corvo-publish/Corvo-Navegador.apk | awk '{print $1}')
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"https://raw.githubusercontent.com/mais1fraseofc-dot/Sai-Capeta/corvo-navegador-updates/corvo-publish/Corvo-Navegador.apk","sha256":"%s"}\n' "$CODE" "$NAME" "$HASH" > corvo-publish/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corvo-publish/Corvo-Navegador.apk corvo-publish/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Corvo beta version $NAME"
            git push origin HEAD:corvo-navegador-updates
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Corvo-Navegador-Atualizavel
          path: corvo-publish/Corvo-Navegador.apk
