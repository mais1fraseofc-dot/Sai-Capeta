name: Compilar Sai Capeta (ZIP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sai-Capeta-projeto.zip'
      - '.github/workflows/compilar-zip.yml'
      - 'scripts/corrigir-ativacao.py'
      - 'scripts/importar-contatos-lote.py'

permissions:
  contents: read

jobs:
  construir-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          test -f Sai-Capeta-projeto.zip || { echo "Arquivo ZIP nao encontrado."; exit 1; }
          mkdir -p fonte
          unzip -q Sai-Capeta-projeto.zip -d fonte
          test -f fonte/SaiCapeta/app/build.gradle || { echo "Projeto Android nao encontrado dentro do ZIP."; exit 1; }

      - name: Aplicar correcoes de permissao e layout (v1.2.1)
        run: python3 scripts/corrigir-ativacao.py fonte/SaiCapeta

      - name: Implementar importacao multipla e total de contatos
        run: python3 scripts/importar-contatos-lote.py fonte/SaiCapeta

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar componentes Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        run: gradle -p fonte/SaiCapeta :app:assembleDebug --no-daemon --stacktrace

      - name: Salvar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: Sai-Capeta-APK-teste
          path: fonte/SaiCapeta/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
